<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroTimer</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    padding-bottom: 120px;
    background: #fff;
}

.header-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 20px;
}

.logo {
    width: 128px;
    height: auto;
    margin-bottom: 10px;
}

.title {
    font-size: 24px;
    font-weight: 700;
    text-align: left;
}

.tagline {
    font-size: 14px;
    color: #666;
    margin-top: 6px;
}

#label {
    font-size: 16px;
    margin-top: 40px;
    margin-bottom: 10px;
}

#display {
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 30px;
}

.row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}

/* PulseCounter-sized buttons */
button,
.buy-btn {
    padding: 10px 18px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
}

#startBtn,
#stopBtn,
#copyBtn,
.buy-btn {
    background: #1877f2;
    color: #fff;
}

#resetBtn {
    background: #000;
    color: #fff;
}

button:active,
.buy-btn:active {
    opacity: .85;
}

.buy-footer {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 1000;
}

.buy-btn {
    display: inline-block;
}
</style>
</head>

<body>

<div class="header-row">
    <img src="./IMG_1741.jpeg" class="logo" alt="MicroFoundary Logo">

    <div class="title">MicroTimer</div>

    <div class="tagline">
        Simple stopwatch for quick timing.
    </div>
</div>

<div id="label">Seconds</div>

<div id="display">0</div>

<div class="row">
    <button id="startBtn" onclick="startTimer()">Start</button>
    <button id="stopBtn" onclick="stopTimer()">Stop</button>
    <button id="resetBtn" onclick="resetTimer()">Reset</button>
    <button id="copyBtn" onclick="copyTime()">Copy</button>
</div>

<div class="buy-footer">
    <button class="buy-btn">Buy This Tool</button>
</div>

<script>
let timer = null;
let count = 0;

function updateDisplay() {
    document.getElementById("display").textContent = count;
}

function startTimer() {
    if (timer === null) {
        timer = setInterval(() => {
            count++;
            updateDisplay();
        }, 1000);
    }
}

function stopTimer() {
    clearInterval(timer);
    timer = null;
}

function resetTimer() {
    stopTimer();
    count = 0;
    updateDisplay();
}

function copyTime() {
    navigator.clipboard.writeText(count.toString());

    const btn = document.getElementById("copyBtn");
    const originalText = btn.textContent;

    btn.textContent = "Copied!";

    setTimeout(() => {
        btn.textContent = originalText;
    }, 1500);
}
</script>

</body>
</html>
