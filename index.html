<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroTimer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        padding-bottom: 90px;
        background: white;
    }

    .header-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 20px;
    }

    .logo {
        width: 128px;
        height: auto;
        max-width: none;
        margin-bottom: 10px;
    }

    .title {
        font-size: 24px;
        font-weight: 700;
        text-align: left;
    }

    .tagline {
        font-size: 14px;
        color: #666;
        margin-top: 4px;
    }

    #label {
        font-size: 16px;
        margin-bottom: 6px;
        text-align: left;
    }

    #display {
        font-size: 48px;
        padding: 12px 0;
        background: white;
        border: none;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 20px;
        text-align: left;
        font-weight: bold;
    }

    .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        padding: 10px 18px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    #startBtn,
    #stopBtn,
    #copyBtn {
        background: #0078ff;
        color: white;
    }

    #resetBtn {
        background: #000;
        color: white;
    }

    button:active {
        opacity: 0.85;
    }

    .buy-footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        border-top: 1px solid #ddd;
        padding: 12px;
        box-sizing: border-box;
    }

    .buy-btn {
        width: 100%;
        background: #0078ff;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
    }
</style>
</head>

<body>

<div class="header-row">
    <img src="./IMG_1741.jpeg" class="logo" alt="MicroFoundary Logo">
    <div class="title">MicroTimer</div>
    <div class="tagline">Simple stopwatch for quick timing.</div>
</div>

<div id="label">Seconds</div>
<div id="display">0</div>

<div class="row">
    <button id="startBtn" onclick="startTimer()">Start</button>
    <button id="stopBtn" onclick="stopTimer()">Stop</button>
    <button id="resetBtn" onclick="resetTimer()">Reset</button>
    <button id="copyBtn" onclick="copyTime()">Copy</button>
</div>

<div class="buy-footer">
    <button class="buy-btn">Buy This Tool</button>
</div>

<script>
let timer = null;
let count = 0;

function updateDisplay() {
    document.getElementById("display").textContent = count;
}

function startTimer() {
    if (timer === null) {
        timer = setInterval(() => {
            count++;
            updateDisplay();
        }, 1000);
    }
}

function stopTimer() {
    clearInterval(timer);
    timer = null;
}

function resetTimer() {
    stopTimer();
    count = 0;
    updateDisplay();
}

function copyTime() {
    navigator.clipboard.writeText(count.toString());
}
</script>

</body>
</html>
