<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroTimer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #timerDisplay {
            font-size: 48px;
            margin: 20px 0;
            font-weight: bold;
        }

        input {
            width: 120px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        #startBtn {
            background-color: #4CAF50;
            color: white;
        }

#resetBtn {
    background-color: #cccccc;
    color: #333;
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    margin: 10px;
    cursor: pointer;
}

#resetBtn:hover {
    background-color: #bbbbbb;
}

    </style>
</head>
<body>

    <h1>MicroTimer</h1>

    <input type="number" id="secondsInput" placeholder="Seconds">

    <div id="timerDisplay">0</div>

    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>

    <script>
        let countdown;
        let remaining = 0;

        const display = document.getElementById("timerDisplay");
        const input = document.getElementById("secondsInput");
        const startBtn = document.getElementById("startBtn");
        const resetBtn = document.getElementById("resetBtn");

        startBtn.onclick = () => {
            clearInterval(countdown);
            remaining = parseInt(input.value, 10);

            if (isNaN(remaining) || remaining <= 0) {
                display.textContent = "0";
                return;
            }

            display.textContent = remaining;

            countdown = setInterval(() => {
                remaining--;
                display.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(countdown);
                }
            }, 1000);
        };

        resetBtn.onclick = () => {
            clearInterval(countdown);
            remaining = 0;
            display.textContent = "0";
            input.value = "";
        };
    </script>

</body>
</html>
