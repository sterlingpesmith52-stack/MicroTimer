<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroTimer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: white; /* pure white brand background */
    }

    .header-row {
        display: flex;
        flex-direction: column; /* logo above title */
        align-items: flex-start; /* left aligned */
        margin-bottom: 20px;
    }

    .logo {
        width: 128px;      /* your requested size */
        height: auto;
        max-width: none;   /* prevents iPhone Chrome auto-shrink */
        margin-bottom: 10px;
    }

    .title {
        font-size: 22px;
        font-weight: 600;
        text-align: left;
    }

    #label {
        font-size: 16px;
        margin-bottom: 6px;
        text-align: left;
    }

    #display {
        font-size: 32px;
        padding: 12px 20px; /* right padding fixed */
        background: white;
        border: 1px solid #ccc;
        border-radius: 6px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 16px;
        text-align: left;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    button {
        padding: 10px 18px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        display: inline-block; /* button only as wide as text */
        text-align: left;
    }

    #startBtn {
        background: #0078ff;
        color: white;
    }

    #stopBtn {
        background: #666; /* neutral gray */
        color: white;
    }

    #resetBtn {
        background: #999;
        color: white;
    }

    button:active {
        opacity: 0.85;
    }
</style>
</head>

<body>

<div class="header-row">
    <img src="./IMG_1741.jpeg" class="logo" alt="MicroFoundary Logo">
    <div class="title">MicroTimer</div>
</div>

<div id="label">Seconds</div>
<div id="display">0</div>

<div class="row">
    <button id="startBtn" onclick="startTimer()">Start</button>
    <button id="stopBtn" onclick="stopTimer()">Stop</button>
    <button id="resetBtn" onclick="resetTimer()">Reset</button>
</div>

<script>
let timer = null;
let count = 0;

function updateDisplay() {
    document.getElementById("display").textContent = count;
}

function startTimer() {
    if (timer === null) {
        timer = setInterval(() => {
            count++;
            updateDisplay();
        }, 1000);
    }
}

function stopTimer() {
    clearInterval(timer);
    timer = null;
}

function resetTimer() {
    stopTimer();
    count = 0;
    updateDisplay();
}
</script>

</body>
</html>
